<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1114">
  <title>Осмотр насоса</title>
  <link href="style.css" rel="stylesheet">
  <link href="camera.css" rel="stylesheet">
  <script>
    // Настройки. Любую можно переопределить параметром в адресе страницы, например:
    //   index.html?server=http://localhost:8000&tag=AMS_1&debug=1
    const params = new URLSearchParams(location.search);

    // Адрес бэкенда: запросы идут на {server}/devices/{тег} и {server}/ai/{тег}.
    // Пусто — тот же сервер, что отдаёт страницу.
    window.PUMP_SERVER = params.get('server') ?? '';

    // Панель отладки: ?debug=1 — включить, ?debug=0 — выключить.
    // Без параметра включается на компьютере (мышь) и выключается на телефоне.
    window.PUMP_DEBUG = params.has('debug')
      ? params.get('debug') !== '0'
      : matchMedia('(pointer: fine)').matches;

    // Тег при открытии страницы. В режиме отладки по умолчанию AMS_1, иначе — пусто
    // (ждём QR-код). Сканер QR-кодов работает всегда: новый код сменит этот тег.
    // ?tag=AMS_2 — другой тег при открытии, ?tag= — без тега и в режиме отладки.
    window.PUMP_DEFAULT_TAG = params.get('tag') ?? (window.PUMP_DEBUG ? 'AMS_1' : '');
  </script>
  <script src="script.js" defer></script>
  <script src="camera.js" defer></script>
</head>
<body>
  <!-- Экран камеры: видео, контуры, плашка проблем и плашка оборудования (camera.js, script.js) -->
  <main class="camera-viewport" id="cameraViewport" aria-labelledby="scannerTitle">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="hints" class="cam-hints"></div>

    <div class="scan-prompt" id="scanPrompt">
      <div class="scanner-frame" aria-hidden="true"></div>
      <h1 id="scannerTitle">Наведите камеру на QR-код</h1>
      <p class="scanner-description">Оборудование определится автоматически.</p>
    </div>

    <div id="topStack" class="cam-top">
      <!-- Плашка оборудования: название, id, счётчики отклонений; открывает параметры -->
      <button class="equipment-card" type="button" id="equipmentCard" hidden>
        <span class="equipment-text">
          <span class="equipment-name" id="equipmentName"></span>
          <span class="equipment-id" id="equipmentId"></span>
        </span>
        <span class="equipment-side">
          <span class="equipment-arrow" aria-hidden="true">→</span>
          <span class="equipment-counts">
            <span class="count-badge warning" id="warningCount" hidden></span>
            <span class="count-badge error" id="errorCount" hidden></span>
          </span>
        </span>
      </button>
      <!-- Панель отладки (window.PUMP_DEBUG): источник кадров, пауза, сохранение кадра, статус -->
      <div id="debugBar" class="cam-debugbar" hidden>
        <label class="cam-button cam-debug-button">
          Фото или видео…
          <input type="file" id="debugFile" accept="image/*,video/*" hidden>
        </label>
        <button class="cam-button cam-debug-button" type="button" id="debugCamera">Камера</button>
        <button class="cam-button cam-debug-button" type="button" id="debugPause">Пауза анализа</button>
        <button class="cam-button cam-debug-button" type="button" id="debugOnce" hidden>Один кадр</button>
        <button class="cam-button cam-debug-button" type="button" id="debugSave">Сохранить кадр</button>
        <button class="cam-button cam-debug-button" type="button" id="debugClear">Очистить проблемы</button>
      </div>
      <div id="debug" class="cam-debug" hidden></div>
      <div id="toast" class="cam-toast" role="status" hidden></div>
    </div>

    <div id="bottomStack" class="cam-bottom">
      <!-- Красные проблемы с камеры: название и совет -->
      <section id="problemPanel" class="cam-panel" aria-label="Проблемы" hidden>
        <div id="prevSide" class="cam-panel-side">
          <button class="cam-button" type="button" id="prevProblem" aria-label="Предыдущая проблема">‹</button>
          <span id="prevCount" class="cam-panel-count"></span>
        </div>
        <div class="cam-panel-body" aria-live="polite">
          <p id="panelProblem" class="cam-panel-problem"></p>
          <p id="panelSolution" class="cam-panel-solution"></p>
        </div>
        <div id="nextSide" class="cam-panel-side">
          <button class="cam-button" type="button" id="nextProblem" aria-label="Следующая проблема">›</button>
          <span id="nextCount" class="cam-panel-count"></span>
        </div>
      </section>

    </div>

    <div id="cameraMessage" class="cam-message">
      <p id="cameraMessageText">Включаем камеру…</p>
      <button class="cam-button" type="button" id="cameraRetry" hidden>Включить камеру</button>
    </div>
  </main>

  <!-- Параметры: открываются поверх камеры, страница не перезагружается -->
  <section class="parameters" id="parameters" aria-labelledby="parametersName" hidden>
    <header class="parameters-header">
      <button class="parameters-back" type="button" id="parametersBack" aria-label="Назад к камере">←</button>
      <div class="parameters-title">
        <h2 id="parametersName"></h2>
        <p id="parametersId"></p>
      </div>
    </header>
    <div class="parameters-scroll">
      <div class="parameters-error" id="parametersError" role="alert" hidden>
        <p id="parametersErrorText"></p>
        <button type="button" id="parametersRetry">Повторить</button>
      </div>
      <p class="parameters-note" id="parametersNote" hidden></p>
      <div class="parameters-list" id="parametersList" role="list"></div>
    </div>
  </section>
</body>
</html>
